services:
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: buildflow_db
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "BuildFlow!Password123" 
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  backend:
    build: ./backend
    container_name: buildflow_backend
    restart: always
    environment:
      - PORT=5000
      - DB_SERVER=db
      - DB_USER=sa
      - DB_PASSWORD=BuildFlow!Password123
      - DB_NAME=BuildFlowDB
      - JWT_SECRET=my_super_secret_string_for_buildflow_12345
    ports:
      - "5000:5000"
    depends_on:
      - db
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: buildflow_frontend_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./certs:/etc/nginx/certs

volumes:
  sql_data: